name: GitFit Sync

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_FIT_DATABASE_PATH: ${{ vars.GIT_FIT_DATABASE_PATH || 'data/db/git-fit.db' }}

jobs:
  sync:

    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      matrix:
        ruby-version: ['3.4']

    env:
      GIT_FIT_SYNC_TIME_BUDGET: ${{ vars.GIT_FIT_SYNC_TIME_BUDGET || '300' }}

    steps:
    - uses: actions/checkout@v4
    - name: Cache git-fit database
      uses: actions/cache@v4
      with:
        path: data/db
        key: git-fit-db
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true
    - name: Run sync
      run: bundle exec git fit sync
      env:
        GIT_FIT_KEEP_PHONE: ${{ secrets.GIT_FIT_KEEP_PHONE }}
        GIT_FIT_KEEP_PASSWORD: ${{ secrets.GIT_FIT_KEEP_PASSWORD }}
